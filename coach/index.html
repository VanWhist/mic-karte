function makeConditionExternalCard(data) {
  const name = escHtml(data.systemName || "別のコンディション管理システム");
  const url = data.systemUrl || CONDITION_APP_URL;
  return makeCard("コンディション", "gold",
    `<div class="mandala-empty">この選手は <b>${name}（別ツール）</b>で管理しています。<br>MICコンディション管理には記録されません。</div>
     <a class="cond-cta secondary" href="${url}" target="_blank" rel="noopener">${name}を開く →</a>`);
}

// ---- 選手用 -------------------------------------------------
function makeConditionAthleteCard() {
  const token = VIEW_TOKEN;
  if (!token) return null;
  loadCondition(token, "getAthleteData");
  const cache = conditionCache["getAthleteData:" + token];

  if (!cache || cache.status === "loading") {
    return makeCard("コンディション", "green", `<div class="mandala-empty">読み込み中…</div>`);
  }
  if (cache.status === "error") {
    return makeCard("コンディション", "green",
      `<div class="mandala-empty">データを取得できませんでした（${escHtml(cache.error)}）。</div>
       <div class="mandala-summary"><a class="mandala-link" href="javascript:void(0)" onclick="window.retryCondition('${token}','getAthleteData')">再読み込み →</a>
       <a class="mandala-link" href="${CONDITION_APP_URL}?token=${token}" target="_blank" rel="noopener">アプリを開く →</a></div>`);
  }

  const data = cache.data || {};
  if (data.external) return makeConditionExternalCard(data);
  if (data.error) {
    return makeCard("コンディション", "green",
      `<div class="mandala-empty">コンディション管理の情報を取得できませんでした。</div>`);
  }

  const appUrl = CONDITION_APP_URL + "?token=" + token;
  const records = (data.records || []).slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const today = condToday();

  if (!records.length) {
    return makeCard("コンディション", "green",
      `<div class="mandala-empty">まだコンディションの記録がありません。<br>アプリで記録をつけると、今日の状態がここにまとまります。</div>
       <a class="cond-cta" href="${appUrl}" target="_blank" rel="noopener">今日の記録をつける →</a>
       <div class="mandala-summary" style="margin-top:8px;"><span>睡眠・疲労感・気分・食欲・筋肉痛の部位・ケガや違和感を、1日1回タップで記録します。</span></div>`);
  }

  const last = records[0];
  const days = condDaysAgo(last.date);
  const isToday = days === 0;

  let fresh;
  if (isToday) fresh = `<span class="cond-fresh">今日 記録済み</span>`;
  else if (days === 1) fresh = `<span class="cond-fresh warn">昨日が最後の記録です</span>`;
  else fresh = `<span class="cond-fresh warn">${days}日 記録が空いています</span>`;

  const stamp = isToday ? "" : condMD(last.date);
  const tiles = [
    ["睡眠", last.sleep || "—", stamp],
    ["疲労感", (last.fatigue || last.fatigue === 0) ? String(last.fatigue) : "—", last.fatigue ? "5段階中" : ""],
    ["気分", (last.mood || last.mood === 0) ? String(last.mood) : "—", last.mood ? "5段階中" : ""],
    ["食欲", last.appetite || "—", ""]
  ];
  let tilesHtml = `<div class="cond-tiles">`;
  tiles.forEach(t => {
    const isTxt = !/^[0-9]+(\.[0-9]+)?$/.test(t[1]) && t[1].length > 4;
    tilesHtml += `<div class="cond-tile"><div class="k">${escHtml(t[0])}</div>` +
                 `<div class="v${isTxt ? " txt" : ""}">${escHtml(t[1])}</div>` +
                 (t[2] ? `<div class="u">${escHtml(t[2])}</div>` : "") + `</div>`;
  });
  tilesHtml += `</div>`;

  // からだの記録。「いつの記録か」を必ず添えて、過去の記録が現在の症状に見えないようにする。
  const injuries = (data.injuries || []).slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const latestInj = injuries.length ? injuries[0] : null;
  let sub = "";
  if (last.muscleParts || latestInj) {
    sub += `<div class="cond-sub"><div class="h">からだの記録</div>`;
    if (last.muscleParts) {
      sub += `<div class="l">筋肉痛：${escHtml(last.muscleParts)}${isToday ? "" : ` <span class="d">${condMD(last.date)}の記録</span>`}</div>`;
    }
    if (latestInj) {
      sub += `<div class="l">違和感：${escHtml(latestInj.part || "")} ${escHtml(String(latestInj.severity || "-"))}/5 <span class="d">${condMD(latestInj.date)}の記録</span></div>`;
    }
    sub += `</div>`;
  }

  // 直近7日の記録有無。継続性の確認用なので小さく脇に置く。
  const dateSet = {};
  records.forEach(r => { dateSet[r.date] = true; });
  let dots = `<div class="dots">`;
  let count7 = 0;
  for (let i = 6; i >= 0; i--) {
    const d = condShiftDate(today, -i);
    const on = !!dateSet[d];
    if (on) count7++;
    dots += `<i class="${on ? "on" : ""}${i === 0 ? " today" : ""}"></i>`;
  }
  dots += `</div>`;

  const html =
    fresh + tilesHtml + sub +
    `<div class="cond-strip">${dots}<span class="tx">直近7日：${count7}日 記録</span></div>` +
    (isToday ? "" : `<a class="cond-cta" href="${appUrl}" target="_blank" rel="noopener">今日の記録をつける →</a>`) +
    `<div class="mandala-summary"><a class="mandala-link" href="${appUrl}" target="_blank" rel="noopener">コンディション管理を開く →</a></div>`;

  return makeCard("コンディション", "green", html);
}

// ---- コーチ用 -----------------------------------------------
function makeConditionCoachCard() {
  const token = VIEW_TOKEN;
  if (!token) {
    return makeCard("コンディション", "green",
      `<div class="mandala-empty">コンディションを表示するには、コーチ用トークン付きのURL（<code>/coach/?token=…</code>）で開いてください。</div>
       <a class="cond-cta secondary" href="${CONDITION_APP_URL}" target="_blank" rel="noopener">コンディション管理を開く →</a>`);
  }
  loadCondition(token, "getCoachView");
  const cache = conditionCache["getCoachView:" + token];

  if (!cache || cache.status === "loading") {
    return makeCard("コンディション", "green", `<div class="mandala-empty">読み込み中…</div>`);
  }
  if (cache.status === "error") {
    return makeCard("コンディション", "green",
      `<div class="mandala-empty">データを取得できませんでした（${escHtml(cache.error)}）。</div>
       <div class="mandala-summary"><a class="mandala-link" href="javascript:void(0)" onclick="window.retryCondition('${token}','getCoachView')">再読み込み →</a></div>`);
  }
  const data = cache.data || {};
  if (data.error || !data.athletes) {
    return makeCard("コンディション", "green",
      `<div class="mandala-empty">コンディションの一覧を取得できませんでした。コーチ用トークンかどうかご確認ください。</div>`);
  }

  const rows = data.athletes.slice();
  const appUrl = CONDITION_APP_URL + "?token=" + token;

  // ---- 詳細（行をタップした状態）----
  if (conditionCoachOpen) {
    const r = rows.filter(x => x.name === conditionCoachOpen)[0];
    if (r) {
      const j = condJudge(r);
      const html =
        `<button class="cond-back" onclick="window.condBackToList()">← 一覧に戻る</button>
         <div class="cond-banner ${j.key}"><div class="lb">${escHtml(j.label)}</div><div class="ex">${escHtml(j.why)}</div></div>
         <div class="cond-kv">
           <div class="b"><div class="k">疲労感（最新）</div><div class="v">${r.latestFatigue == null ? "—" : escHtml(String(r.latestFatigue)) + ' <small>/ 5</small>'}</div></div>
           <div class="b"><div class="k">疲労感（7日平均）</div><div class="v">${r.avgFatigue == null ? "—" : escHtml(String(r.avgFatigue)) + ' <small>/ 5</small>'}</div></div>
           <div class="b"><div class="k">ケガ・違和感</div><div class="v">${r.hasInjury ? "記録あり" : "記録なし"}</div></div>
           <div class="b"><div class="k">記録の状況</div><div class="v">${escHtml(String(r.recentRecordCount || 0))}<small> 日 / 7日</small></div></div>
         </div>
         <div class="mandala-summary"><span>最終記録：${escHtml(condFreshText(r.daysSinceLastRecord))}${r.lastRecordDate ? "（" + escHtml(condMD(r.lastRecordDate)) + "）" : ""}</span></div>
         <div class="mandala-empty" style="padding-top:2px;">この画面に出るのはこの4項目だけです。睡眠・気分・自由メモ・部位などの詳細と、月経に関する情報は含まれません。</div>
         <a class="cond-cta secondary" href="${appUrl}" target="_blank" rel="noopener">コンディション管理（コーチ画面）を開く →</a>`;
      return makeCard("コンディション／" + escHtml(r.name), "green", html);
    }
    conditionCoachOpen = null; // 選手が見つからない場合は一覧へ戻す
  }

  // ---- 一覧 ----
  const order = { red: 0, amber: 1, gray: 2, green: 3 };
  rows.sort((a, b) => order[condJudge(a).key] - order[condJudge(b).key]);

  let html = `<div class="cond-legend">
      <span><i style="background:#1f9d55"></i>通常確認</span>
      <span><i style="background:#e08a00"></i>確認あり</span>
      <span><i style="background:#d64545"></i>優先確認</span>
      <span><i style="background:#9aa0a8"></i>記録不足</span>
    </div>`;
  rows.forEach(r => {
    const j = condJudge(r);
    const bits = [];
    if (r.latestFatigue != null) bits.push("疲労 最新" + r.latestFatigue + (r.avgFatigue != null ? " / 7日平均" + r.avgFatigue : ""));
    else if (r.avgFatigue != null) bits.push("疲労 7日平均" + r.avgFatigue);
    if (r.hasInjury) bits.push("違和感あり");
    const nameAttr = escHtml(escAttrJs(r.name));
    html += `<button class="cond-row" onclick="window.condOpenAthlete('${nameAttr}')">
        <span class="sig ${j.key}">${escHtml(j.label)}</span>
        <span class="mid">
          <span class="nm">${escHtml(r.name)}</span>
          <span class="l1">${escHtml(bits.length ? bits.join("　/　") : "記録がありません")}</span>
          <span class="l2">${escHtml(condFreshText(r.daysSinceLastRecord) + "　・　直近7日 " + (r.recentRecordCount || 0) + "日")}</span>
        </span>
        <span class="chev">›</span>
      </button>`;
  });
  html += `<div class="mandala-empty" style="padding-top:10px;">色は体調の判定ではなく、<b>今日どの選手から声をかけるか</b>の目安です。練習の可否は判定しません。</div>`;
  html += `<a class="cond-cta secondary" href="${appUrl}" target="_blank" rel="noopener">コンディション管理（コーチ画面）を開く →</a>`;

  return makeCard("コンディション（在籍" + rows.length + "名）", "green", html);
}

// トークン解決に失敗した場合(無効なリンク)や、リゾルバ自体への通信が失敗した場合に
// 選手切り替えタブ・更新日表示を隠し、appBodyにエラーメッセージのみを表示する。
function renderFatalError(message) {
  document.getElementById("selector").style.display = "none";
  document.getElementById("updatedRow").textContent = "";
  document.getElementById("appBody").innerHTML =
    `<div class="card"><div class="card-body"><div class="mandala-empty">${message}</div></div></div>`;
}

// 起動処理。URLの?token=の有無で「選手専用モード」か「コーチ用(全選手)モード」かを判定し、
// 名簿リゾルバAPIから実データを取得してATHLETESを組み立ててから初回render()を呼ぶ。
async function initApp() {
  const urlToken = new URLSearchParams(location.search).get("token");
  VIEW_TOKEN = urlToken; // コンディション管理APIにそのまま渡す
  let singlePerson = null;

  try {
    if (urlToken) {
      const res = await fetch(RESOLVER_URL + "?token=" + encodeURIComponent(urlToken));
      const data = await res.json();
      if (data.error) {
        renderFatalError("このリンクは無効です。お手数ですが担当コーチにご確認ください。");
        return;
      }
      if (data.type === "athlete") {
        singlePerson = data;
      }
      // data.type === "coach" の場合は下の「全選手取得」にそのままフォールスルーする
    }
    VIEW_MODE = singlePerson ? "player" : "coach";

    if (singlePerson) {
      ATHLETES = { [singlePerson.name]: buildAthleteEntry(singlePerson, false) };
      current = singlePerson.name;
      document.getElementById("selector").style.display = "none";
      document.getElementById("draftBanner").textContent =
        "このページは" + singlePerson.name + "選手専用です。マンダラチャート・短期目標・シーズン目標などはスプレッドシート/フォームの回答からライブに反映されます。";
    } else {
      const res = await fetch(RESOLVER_URL + "?list=athletes");
      const data = await res.json();
      if (!data.athletes || !data.athletes.length) {
        renderFatalError("選手データを取得できませんでした。しばらくしてから再度お試しください。");
        return;
      }
      const built = {};
      data.athletes.forEach(p => { built[p.name] = buildAthleteEntry(p, true); });
      ATHLETES = built;
      if (!ATHLETES[current]) current = Object.keys(ATHLETES)[0];
    }
    render();
  } catch (err) {
    renderFatalError("データの取得に失敗しました。時間をおいて再度お試しください（" + err + "）。");
  }
}

initApp();
</script>
