<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIC選手カルテ</title>
<style>
  :root {
    --surface-1: #ffffff;
    --page: #f4f5f7;
    --text-primary: #0b0b0b;
    --text-secondary: #55575c;
    --text-muted: #8a8d93;
    --gridline: #e7e8ec;
    --border: rgba(11,11,11,0.08);
    --blue-450: #2a78d6;
    --blue-250: #86b6ef;
    --blue-350: #5598e7;
    --blue-550: #1c5cab;
    --blue-650: #104281;
    --accent-soft: #eaf2fc;
    --gold-soft: #fbf3df;
    --gold-line: #d79b00;
    --gold-text: #8a6400;
    --green-soft: #eaf7ef;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* App chrome */
  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    padding: calc(var(--safe-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--gridline);
  }
  .app-title {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 10px;
    letter-spacing: 0.01em;
  }
  .segmented {
    display: flex;
    background: var(--page);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    border-radius: 8px;
    font-family: inherit;
  }
  .segmented button.active {
    background: var(--surface-1);
    color: var(--text-primary);
    box-shadow: 0 1px 3px rgba(11,11,11,0.12);
  }
  /* 選手切り替えタブのコンディション信号(2026/08/23追加。コーチ用のみ)。
     色の意味は下のコンディションカードと同じで、「体調の判定」ではなく確認優先度。
     記録不足だけは中抜きの輪にして、色が付いている状態と見分けられるようにする。
     別システムで管理している選手にはドットを付けない。 */
  .segmented button.has-dot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .segmented .sel-dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none; display: block;
  }
  .segmented .sel-dot.green { background: #1f9d55; }
  .segmented .sel-dot.amber { background: #e08a00; }
  .segmented .sel-dot.red   { background: #d64545; }
  .segmented .sel-dot.gray  { background: transparent; box-shadow: inset 0 0 0 2px #b6bbc2; }
  .updated-row {
    display: flex;
    justify-content: center;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .app-body {
    padding: 12px 12px calc(var(--safe-bottom) + 28px);
    max-width: 480px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface-1);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(11,11,11,0.05);
    border: 1px solid var(--border);
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 8px;
  }
  .card-head .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue-450);
    flex: none;
  }
  .card-head.gold .dot { background: var(--gold-line); }
  .card-head.green .dot { background: #1f9d55; }
  .card-head h2 {
    font-size: 13.5px;
    font-weight: 700;
    margin: 0;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }
  .card-body { padding: 0 14px 14px; }

  .field { padding: 8px 0; border-top: 1px solid var(--gridline); }
  .field:first-child { border-top: none; padding-top: 0; }
  .field .k { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .field .v { font-size: 14px; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; }
  .field.clickable { cursor: pointer; transition: opacity 0.08s ease; }
  .field.clickable:active { opacity: 0.6; }
  .field .chev { font-size: 10px; color: var(--text-muted); font-weight: 400; }
  .field .chev { font-size: 17px; color: var(--blue-450); font-weight: 700; opacity: 0.7; vertical-align: -2px; }
  .field.sub {
    background: var(--gold-soft);
    border-top: none;
    border-radius: 8px;
    padding: 9px 10px;
    margin: 2px 0 4px;
  }
  .field.sub .k { color: var(--gold-text); }

  .goal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .goal-tile {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 9px 10px;
  }
  .goal-tile .k { font-size: 10.5px; color: var(--blue-450); font-weight: 700; margin-bottom: 3px; }
  .goal-tile .v { font-size: 12.5px; line-height: 1.5; color: var(--text-primary); white-space: pre-wrap; }
  .goal-tile.clickable { cursor: pointer; transition: transform 0.08s ease; }
  .goal-tile.clickable:active { transform: scale(0.97); }
  .goal-tile.clickable { position: relative; padding-right: 30px; }
  .goal-tile.clickable::after {
    content: "\203A";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 24px;
    font-weight: 700;
    color: var(--blue-450);
    opacity: 0.6;
  }
  .goal-tile.muted { background: var(--page); opacity: 0.7; }
  a.goal-tile { display: block; text-decoration: none; color: inherit; }

  /* self-assessment bars */
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; }
  .bar-row .name { font-size: 11px; color: var(--text-secondary); text-align: right; white-space: nowrap; }
  .bar-track { position: relative; height: 16px; background: var(--page); border-radius: 4px; }
  .bar-fill { position: absolute; left: 0; top: 0; height: 16px; border-radius: 4px; display: flex; align-items: center; }
  .bar-fill span { color: #fff; font-size: 10px; font-weight: 700; margin-left: auto; margin-right: 5px; }
  .bar-row .val { font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .focus-chip {
    display: inline-block;
    font-size: 9.5px;
    background: var(--gold-soft);
    color: var(--gold-text);
    border: 1px solid var(--gold-line);
    border-radius: 999px;
    padding: 1px 6px;
    margin-left: 4px;
  }
  .focus-note { font-size: 11px; color: var(--text-muted); margin-top: 10px; }

  .life-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .life-tile { background: var(--page); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .life-tile .k { font-size: 9.5px; color: var(--text-muted); margin-bottom: 3px; }
  .life-tile .v { font-size: 12px; font-weight: 700; }

  .message-box {
    background: var(--gold-soft);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 10px;
  }
  .message-box .k { font-size: 10.5px; color: var(--gold-text); font-weight: 700; margin-bottom: 4px; }

  .coachnote-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .coachnote-item { padding: 8px 10px; border-radius: 8px; background: var(--page); border: 1px solid var(--gridline); }
  .coachnote-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .coachnote-text { font-size: 13px; color: var(--text-primary); white-space: pre-wrap; }
  .coachnote-input { width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical; margin-bottom: 6px; }
  .coachnote-btn { border: none; background: var(--blue-450); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .coachnote-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .coachnote-status { font-size: 11px; color: var(--text-muted); margin-top: 6px; min-height: 14px; }

  .coachnote-thread { border: 1px solid var(--gridline); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #fff; }
  .coachnote-thread-header { font-size: 12px; color: var(--text-primary); font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .coachnote-thread-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .coachnote-best-badge { font-size: 10.5px; color: var(--gold-text); background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 10px; padding: 1px 8px; font-weight: 700; }
  .coachnote-video-links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .coachnote-video-link { font-size: 11px; color: var(--blue-450); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; text-decoration: none; }
  .coachnote-bubbles { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .coachnote-bubble { max-width: 88%; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; }
  .coachnote-bubble.athlete { align-self: flex-start; background: #eaf1fb; border: 1px solid rgba(42,120,214,0.2); }
  .coachnote-bubble.coach { align-self: flex-end; background: var(--gold-soft); border: 1px solid var(--gold-line); }
  .coachnote-bubble .who { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .coachnote-bubble .txt { white-space: pre-wrap; color: var(--text-primary); }
  .coachnote-reply-row { display: flex; gap: 6px; align-items: flex-start; }
  .coachnote-reply-input { flex: 1; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; font-family: inherit; resize: vertical; min-height: 32px; }
  .coachnote-reply-btn { border: none; background: var(--blue-450); color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .coachnote-reply-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .coachnote-general-heading { font-size: 11.5px; color: var(--text-muted); font-weight: 700; margin: 4px 0 6px; }

  .mandala-3x3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .mandala-cell {
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .mandala-cell.center {
    background: var(--gold-soft);
    border: 1px solid var(--gold-line);
  }
  .mandala-cell.center .g {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--gold-text);
    line-height: 1.4;
  }
  .mandala-cell.elem {
    background: var(--page);
    opacity: 0.7;
  }
  .mandala-cell.elem.started {
    background: var(--accent-soft);
    border: 1px solid var(--blue-250);
    opacity: 1;
  }
  .mandala-cell.elem .n {
    font-size: 11px;
    font-weight: 700;
    color: var(--blue-550);
    margin-bottom: 2px;
    line-height: 1.3;
  }
  .mandala-cell.elem .p {
    font-size: 9px;
    color: var(--text-muted);
  }
  .mandala-cell.elem.started .p { color: var(--blue-450); font-weight: 700; }
  .mandala-cell.clickable { cursor: pointer; transition: transform 0.08s ease; }
  .mandala-cell.clickable:active { transform: scale(0.95); }
  .mandala-cell.clickable { position: relative; }
  .mandala-cell.elem.clickable::after {
    content: "\203A";
    position: absolute;
    top: 0px;
    right: 3px;
    font-size: 16px;
    font-weight: 700;
    color: var(--blue-450);
    opacity: 0.6;
  }
  .mandala-cell.center.sub {
    background: var(--accent-soft);
    border: 1px solid var(--blue-350);
  }
  .mandala-cell.center.sub .g { color: var(--blue-550); }
  .mandala-cell.action {
    background: var(--page);
    padding: 6px 4px;
  }
  .mandala-cell.action.filled {
    background: var(--surface-1);
    border: 1px solid var(--gridline);
  }
  .mandala-cell.action .a {
    font-size: 9.5px;
    line-height: 1.35;
    color: var(--text-primary);
  }
  .mandala-cell.action .a.muted {
    color: var(--text-muted);
    font-style: italic;
  }
  .mandala-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .mandala-link {
    color: var(--blue-450);
    font-weight: 700;
    text-decoration: none;
  }
  /* 短期目標カードの2つの入口。同じフォームに飛ぶが、「振り返るだけでもいい」と
     選手に分かるように2つ並べる（2026/08/28 Van様の指示）。 */
  .stg-actions { display: flex; gap: 8px; margin-top: 12px; }
  .stg-act {
    flex: 1; display: block; text-align: center; text-decoration: none;
    font-size: 12px; font-weight: 700; line-height: 1.35;
    padding: 10px 6px; border-radius: 10px;
    border: 1px solid var(--blue-250); background: var(--accent-soft); color: var(--blue-550);
  }
  .stg-act .sub { display: block; font-size: 10px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
  .mandala-empty {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.6;
    padding: 4px 2px 10px;
  }


  /* ===== コンディションカード(2026/08/23追加。MICコンディション管理アプリと連携) ===== */
  .cond-fresh {
    display: inline-flex; align-items: center;
    font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px;
    background: #e6f6ec; color: #14653c;
  }
  .cond-fresh.warn { background: #fdf3e0; color: #8a5200; }
  .cond-fresh.none { background: #eff0f3; color: #5f646c; }

  .cond-tiles { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
  .cond-tile { background: var(--accent-soft); border-radius: 10px; padding: 9px 6px; text-align: center; }
  .cond-tile .k { font-size: 10px; color: var(--blue-450); font-weight: 700; margin-bottom: 3px; }
  .cond-tile .v { font-size: 15px; font-weight: 700; line-height: 1.25; color: var(--text-primary); }
  .cond-tile .v.txt { font-size: 12px; line-height: 1.35; }
  .cond-tile .u { font-size: 10px; color: var(--text-muted); font-weight: 500; }

  .cond-sub { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--gridline); }
  .cond-sub .h { font-size: 10.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; letter-spacing: 0.02em; }
  .cond-sub .l { font-size: 12.5px; line-height: 1.6; color: var(--text-primary); }
  .cond-sub .l .d { color: var(--text-muted); font-size: 11px; }

  .cond-strip { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .cond-strip .dots { display: flex; gap: 4px; }
  .cond-strip .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--gridline); display: block; }
  .cond-strip .dots i.on { background: var(--blue-450); opacity: 0.75; }
  .cond-strip .dots i.today { box-shadow: 0 0 0 2px rgba(42,120,214,0.35); }
  .cond-strip .tx { font-size: 11px; color: var(--text-muted); }

  .cond-cta {
    display: block; width: 100%; margin-top: 10px; background: var(--blue-450); color: #fff;
    border: none; border-radius: 10px; padding: 11px 12px; font-size: 13.5px; font-weight: 700;
    font-family: inherit; text-align: center; text-decoration: none;
  }
  .cond-cta.secondary { background: var(--page); color: var(--blue-550); border: 1px solid var(--border); }

  .cond-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .cond-legend span { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--text-secondary); }
  .cond-legend i { width: 8px; height: 8px; border-radius: 50%; display: block; }

  .cond-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 0; border-top: 1px solid var(--gridline);
    background: none; border-left: none; border-right: none; border-bottom: none;
    font-family: inherit; text-align: left; cursor: pointer;
  }
  .cond-row:first-of-type { border-top: none; }
  .cond-row:active { opacity: 0.55; }
  .cond-row .sig {
    flex: none; width: 52px; text-align: center; border-radius: 8px; padding: 5px 2px;
    font-size: 10px; font-weight: 700; line-height: 1.25;
  }
  .cond-row .mid { flex: 1; min-width: 0; display: block; }
  .cond-row .nm { display: block; font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .cond-row .l1 { display: block; font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; }
  .cond-row .l2 { display: block; font-size: 10.5px; color: var(--text-muted); line-height: 1.5; margin-top: 1px; }
  .cond-row .chev { flex: none; font-size: 19px; color: var(--blue-450); opacity: 0.55; font-weight: 700; }

  .sig.green { background: #e6f6ec; color: #14653c; box-shadow: inset 0 0 0 1px #1f9d55; }
  .sig.amber { background: #fdf3e0; color: #8a5200; box-shadow: inset 0 0 0 1px #e08a00; }
  .sig.red   { background: #fdeae9; color: #8f2b2b; box-shadow: inset 0 0 0 1px #d64545; }
  .sig.gray  { background: #eff0f3; color: #5f646c; box-shadow: inset 0 0 0 1px #9aa0a8; }

  .cond-banner { border-radius: 10px; padding: 10px 11px; margin-bottom: 10px; }
  .cond-banner .lb { font-size: 13.5px; font-weight: 700; }
  .cond-banner .ex { font-size: 11px; opacity: 0.85; margin-top: 1px; line-height: 1.5; }
  .cond-banner.green { background: #e6f6ec; color: #14653c; }
  .cond-banner.amber { background: #fdf3e0; color: #8a5200; }
  .cond-banner.red   { background: #fdeae9; color: #8f2b2b; }
  .cond-banner.gray  { background: #eff0f3; color: #5f646c; }

  .cond-kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cond-kv .b { background: var(--page); border-radius: 10px; padding: 9px 10px; }
  .cond-kv .b .k { font-size: 10.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
  .cond-kv .b .v { font-size: 14px; font-weight: 700; }
  .cond-kv .b .v small { font-size: 11px; font-weight: 500; color: var(--text-muted); }

  .cond-back {
    display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--blue-450);
    background: none; border: none; padding: 0 0 8px; font-family: inherit; cursor: pointer;
  }

  /* ===== 短期目標カード 新レイアウト(2026/08: 今回/前回の比較表示) ===== */

  /* 今回/前回のヘッダー行 */
  .rec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 11px; }
  .rec-chips { display: flex; align-items: center; gap: 6px; }
  .rec-chips.wrap { flex-wrap: wrap; row-gap: 5px; }
  .rec-chip { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .rec-chip.now { background: var(--accent-soft); color: var(--blue-550); border: 1px solid var(--blue-250); }
  .rec-chip.prev { background: var(--page); color: var(--text-muted); border: 1px solid var(--gridline); }
  .rec-chip-sep { font-size: 11px; color: var(--text-muted); }

  /* 前回の目標のふりかえり */
  .review-box { background: var(--gold-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .rb-title { font-size: 10.5px; font-weight: 700; color: var(--gold-text); margin-bottom: 7px; letter-spacing: 0.02em; }
  .rb-achv { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; }
  .rb-achv .lab { font-size: 10.5px; color: var(--gold-text); }
  .rb-achv .val { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .review-row { padding: 6px 0; border-top: 1px solid rgba(215,155,0,0.25); }
  .review-row .k { font-size: 10px; color: var(--gold-text); margin-bottom: 2px; }
  .review-row .v { font-size: 12.5px; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; }
  .rb-more { margin-top: 8px; font-size: 11px; }

  /* タイル内の前回行 */

}

let competeExpanded = false; // 競技についての詳細が開いているか
let trainingDrill = null; // 現在ドリルダウン中の種目名（nullなら全体表示）
const trainingCache = {}; // athlete名 -> { status: 'loading'|'loaded'|'error', records, error }
// 短期目標カードの表示状態(2026/08〜: 1枚のカードで4画面を切り替える)
//   mode "overview": 今回/前回の比較サマリー（初期表示）
//   mode "detail"  : cat の5問を今回/前回で横並び比較
//   mode "history" : 「これまでの記録」の月別一覧
//   mode "record"  : recIndex 番目(records配列のindex)の1か月分の全内容

const stgCache = {}; // athlete名 -> { status: 'loading'|'loaded'|'error', data, error }
const seasonCache = {}; // athlete名 -> { status: 'loading'|'loaded'|'error', data, error }（将来ビジョン/シーズン目標/自己分析/生活習慣・サポート共通）
const mandalaCache = {}; // athlete名 -> { status: 'loading'|'loaded'|'error', data, error }
let airLogDrill = null; // MICエアlogで現在ドリルダウン中のカテゴリ("water"|"trampoline"、nullなら全体表示)
const airLogCache = {}; // apiUrl -> { status: 'loading'|'loaded'|'error', records, error }（全選手共通APIのためathlete名ではなくapiUrlをキーにする）
// コンディションカード用。トークン単位で1回だけ取得する(選手モードは1名、コーチモードは全員分が1レスポンス)。
const conditionCache = {}; // token -> { status: 'loading'|'loaded'|'error', data, error }
let conditionCoachOpen = null; // コーチ用一覧で詳細を開いている選手名(nullなら一覧)

// コンディションのデータがまだ来ていない場合や、選手用モードのときは空のまま(＝ドットを出さない)。
function condSignalByName() {
  if (VIEW_MODE !== "coach" || !VIEW_TOKEN) return {};
  const cache = conditionCache["getCoachView:" + VIEW_TOKEN];
  if (!cache || cache.status !== "loaded" || !cache.data || !cache.data.athletes) return {};
  const map = {};
  cache.data.athletes.forEach(r => { map[r.name] = condJudge(r).key; });

}

function renderSelector() {

// 目標設定シート（回答）に紐づくApps Script Web Appから直接フェッチ
// （将来ビジョン/シーズン目標/自己分析/生活習慣・サポートの4カード共通のデータソース。
// 該当行がまだ無ければ全項目nullのJSONが返る＝未回答扱い）
function loadSeasonData(athleteKey, apiUrl, token) {
  if (seasonCache[athleteKey]) return; // 読み込み中 or 読み込み済み
  seasonCache[athleteKey] = { status: "loading" };
  fetch(apiUrl + "?token=" + encodeURIComponent(token))
    .then(res => res.json())
    .then(data => {
      seasonCache[athleteKey] = { status: "loaded", data: data };
      render();
    })
    .catch(err => {
      seasonCache[athleteKey] = { status: "error", error: String(err) };
      render();
    });
}

// マンダラチャート(選手ごとに別ファイルのGoogleスプレッドシート)に紐づくApps Script Web Appから
// 直接フェッチ（中心目標+8要素[各8アクション]のJSONが返る。まだ未着手ならgoal/gridがnull）
function loadMandalaData(athleteKey, apiUrl, token) {
  if (mandalaCache[athleteKey]) return; // 読み込み中 or 読み込み済み
  mandalaCache[athleteKey] = { status: "loading" };
  fetch(apiUrl + "?token=" + encodeURIComponent(token))
    .then(res => res.json())
    .then(data => {
      mandalaCache[athleteKey] = { status: "loaded", data: data };
      render();
    })
    .catch(err => {
      mandalaCache[athleteKey] = { status: "error", error: String(err) };
      render();
    });
}

// フォームAの回答スプレッドシートに紐づくApps Script Web Appから直接フェッチ
// （name=athleteKeyで検索。該当行がまだ無ければ全項目nullのJSONが返る＝未回答扱い）
// レコードの新しさ比較に使う値。timestamp > filledDate > updated の順で見る。
function stgSortKey(rec) {
  const raw = (rec && (rec.timestamp || rec.filledDate || rec.updated)) || "";
  return String(raw).replace(/[^0-9]/g, "");
}

// 旧A/B API と v2 API の両方を読み、recordsを新しい順にマージする。
// v2側が落ちても旧A/Bだけで表示できるようにし、逆も同じ(片方でも取れれば表示する)。
function loadShortTermGoal(athleteKey, apiUrl, token) {
  if (stgCache[athleteKey]) return; // 読み込み中 or 読み込み済み
  stgCache[athleteKey] = { status: "loading" };
  const q = "?token=" + encodeURIComponent(token);
  const getJson = function (url) {
    return fetch(url + q).then(function (res) { return res.json(); });
  };
  const pOld = getJson(apiUrl).then(function (d) { return { ok: true, data: d }; })
                              .catch(function (e) { return { ok: false, error: String(e) }; });
  const pV2 = STG_V2_API_URL
    ? getJson(STG_V2_API_URL).then(function (d) { return { ok: true, data: d }; })
                             .catch(function (e) { return { ok: false, error: String(e) }; })
    : Promise.resolve({ ok: true, data: null });

  Promise.all([pOld, pV2]).then(function (rs) {
    const o = rs[0], v = rs[1];
    if (!o.ok && !v.ok) {
      stgCache[athleteKey] = { status: "error", error: o.error };
      render();
      return;
    }
    const base = (o.ok && o.data) ? o.data : {};
    const merged = Object.assign({}, base);
    const recs = [].concat(
      (o.ok && o.data && Array.isArray(o.data.records)) ? o.data.records : [],
      (v.ok && v.data && Array.isArray(v.data.records)) ? v.data.records : []
    );
    if (recs.length) {
      recs.sort(function (a, b) {
        const ka = stgSortKey(a), kb = stgSortKey(b);
        if (ka === kb) return 0;
        return ka < kb ? 1 : -1;
      });
      merged.records = recs;
      if (recs[0] && recs[0].updated) merged.updated = recs[0].updated;
    }
    stgCache[athleteKey] = { status: "loaded", data: merged };
    render();
  });
}

// Apps Script Web App から直接フェッチ（トレーニングログアプリと同じ公開APIを利用）
function loadTraining(athleteKey, apiUrl) {
  if (trainingCache[athleteKey]) return; // 読み込み中 or 読み込み済み
  trainingCache[athleteKey] = { status: "loading" };
  fetch(apiUrl)
    .then(res => res.json())
    .then(data => {
      trainingCache[athleteKey] = { status: "loaded", records: data.records || [] };
      render();
    })
    .catch(err => {
      trainingCache[athleteKey] = { status: "error", error: String(err) };
      render();
    });
}

// MICエアlog(ウォータージャンプ・トランポリン記録アプリ)から直接フェッチ。
// 全選手共通のAPIで1回のGETに全選手分のrecordsが含まれるため、apiUrlをキーに1回だけ取得・キャッシュし、
// 選手を切り替えても再フェッチしない。画面表示はathleteName一致でクライアント側フィルタする(8-9参照)。
function loadAirLog(apiUrl) {
  if (airLogCache[apiUrl]) return; // 読み込み中 or 読み込み済み
  airLogCache[apiUrl] = { status: "loading" };
  fetch(apiUrl)
    .then(res => res.json())
    .then(data => {
      airLogCache[apiUrl] = {
        status: "loaded",
        records: data.records || [],
        athletes: data.athletes || [],
        videos: data.videos || [],
        coachNotes: data.coachNotes || [],
      };
      render();
    })
    .catch(err => {
      airLogCache[apiUrl] = { status: "error", error: String(err) };
      render();
    });
}

function epley1RM(weight, reps) {
  if (!weight || !reps) return null;
  return Math.round(weight * (1 + reps / 30) * 10) / 10;
}

// 種目ごとに { 日付: [セット, ...] } へグルーピング（セット番号順）
function groupTrainingByExercise(records) {
  const byExercise = {};
  records.forEach(r => {
    if (!byExercise[r.exercise]) byExercise[r.exercise] = {};
    if (!byExercise[r.exercise][r.date]) byExercise[r.exercise][r.date] = [];
    byExercise[r.exercise][r.date].push(r);
  });
  Object.values(byExercise).forEach(byDate => {
    Object.values(byDate).forEach(sets => sets.sort((a, b) => a.setNumber - b.setNumber));
  });
  return byExercise;
}

function latestSession(byDate) {
  const dates = Object.keys(byDate).sort().reverse();
  if (!dates.length) return null;
  return { date: dates[0], sets: byDate[dates[0]] };
}

// トレーニングログアプリと同じ進捗ロジック（引き継ぎメモ準拠）
// 全セット12回以上&平均RPE<9 → +2.5kg（デッドリフトのみ+5kg）／セット未達 or 高RPE → 同重量維持／それ以外 → 同重量で回数アップ
function nextTarget(exercise, sets) {
  const weighted = sets.filter(s => s.weight);
  if (!weighted.length) return null; // 自重種目(腹筋など)は対象外
  const topWeight = Math.max(...weighted.map(s => s.weight));
  const avgRpe = sets.reduce((sum, s) => sum + (s.rpe || 0), 0) / sets.length;
  const allTwelve = sets.every(s => s.reps >= 12);
  const anyLow = sets.some(s => s.reps < 8);
  if (allTwelve && avgRpe < 9) {
    const inc = exercise === "デッドリフト" ? 5 : 2.5;
    return { weight: topWeight + inc, note: `全セット12回以上・平均RPE${avgRpe.toFixed(1)}だったので、+${inc}kgに挑戦してみよう。` };
  } else if (anyLow || avgRpe >= 9) {
    return { weight: topWeight, note: "8回に届かない、またはきつい(RPE高め)セットがありました。同じ重量でフォームと回数の安定を優先しましょう。" };
  } else {
    return { weight: topWeight, note: "同じ重量で回数アップを狙おう。" };
  }
}

function stgVal(v) {

}

// v2は「課題(main)」と「場所(venues)」を別の軸に分けて持つ。旧A/Bの3カテゴリ構造とは互換性が無いため、
// 表示は source で切り替える(旧レコードの履歴表示は従来のまま壊さない)。
const STG_V2_VENUE_TO_AIRLOG = {

];

function stgIsV2(rec) {
  return !!rec && rec.source === "B2";
}
function stgGoalHasContent(g) {
  return !!(g && (stgVal(g.wantToDo) || stgVal(g.practice) || stgVal(g.criteria)));
}

// 「同じ目標を続ける」を選んだレコードは目標欄が空のまま送信される。
// その場合は過去にさかのぼって最後に設定された目標を探し、カルテ上で目標が消えないようにする。
// 戻り値の from が cur 以外なら「継続」表示にする。
function stgResolveGoal(records, idx) {
  const rec = records[idx];
  if (!rec) return { goal: null, from: null };
  if (stgGoalHasContent(rec.goal)) return { goal: rec.goal, from: rec };
  if (!stgIsV2(rec) || rec.goalMode !== "continue") return { goal: rec.goal || null, from: null };
  for (let i = idx + 1; i < records.length; i++) {
    if (stgGoalHasContent(records[i].goal)) return { goal: records[i].goal, from: records[i] };
  }
  return { goal: null, from: null };
}
// 重点課題・場所も同じ考え方でさかのぼる(継続時は前回の分類をそのまま引き継ぐ)。
function stgResolveFocus(records, idx) {
  const rec = records[idx];
  if (!rec) return null;
  function has(f) { return !!(f && (f.main || (f.venues && f.venues.length))); }
  if (has(rec.focus)) return rec.focus;
  if (stgIsV2(rec) && rec.goalMode === "continue") {
    for (let i = idx + 1; i < records.length; i++) {
      if (has(records[i].focus)) return records[i].focus;
    }
  }
  return rec.focus || null;
}
function stgChipsHtml(focus, extraHtml) {
  const parts = [];
  if (focus && focus.main) parts.push('<span class="rec-chip now">' + escHtml(focus.main) + '</span>');
  if (focus) (focus.venues || []).forEach(function (v) {
    parts.push('<span class="rec-chip prev">' + escHtml(v) + '</span>');
  });
  if (extraHtml) parts.push(extraHtml);
  return parts.length ? '<span class="rec-chips wrap">' + parts.join("") + '</span>' : "";
}

// "2026/08/01" や "2026/08/01 23:40" から "2026年8月" を作る。取れなければ空文字。
function stgMonthLabelFrom(str) {
  const m = String(str == null ? "" : str).match(/(\d{4})[\/\-年](\d{1,2})/);
  return m ? m[1] + "年" + Number(m[2]) + "月" : "";
}

// APIレスポンスから records 配列(記入日の新しい順)を取り出す。
// STG APIが records を返さない場合(旧バージョン・キャッシュ済みレスポンス・静的データ)は、
// 従来キーの categories/plan/updated/reflection から1件だけのrecordsを組み立てて後方互換を保つ。
function stgBuildRecords(data) {
  if (!data) return [];
  if (Array.isArray(data.records)) {
    const rs = data.records.filter(function (r) { return r && (r.categories || r.source === "B2"); });
    if (rs.length) return rs;
  }
  if (!data.categories && !data.plan && !data.updated) return [];
  const filledDate = (data.reflection && data.reflection.filledDate) || null;
  return [{
    source: data.reflection ? "B" : "A",
    month: null,
    monthLabel: stgMonthLabelFrom(filledDate || data.updated),
    filledDate: filledDate,
    updated: data.updated || null,
    categories: data.categories || {},
    plan: data.plan || null,
    reflection: data.reflection || null
  }];
}

  if (!rec) return "";

    if (cache.status === "error") {
      cbody.innerHTML = `
        <div class="mandala-empty">データを取得できませんでした（${escHtml(cache.error)}）。</div>
        <div class="mandala-summary">
          <a class="mandala-link" href="javascript:void(0)" onclick="retryStg('${athleteKey}')">再読み込み →</a>
          <a class="mandala-link" href="${stg.formUrl}" target="_blank" rel="noopener">フォームを開く →</a>
        </div>
      `;
      return card;
    }
    data = cache.data;
  }

  const records = stgBuildRecords(data);
  if (!records.length) {
    cbody.innerHTML = `<div class="mandala-empty">まだ回答がありません。</div>`;
    const f = document.createElement("div");
    f.className = "mandala-summary";
    f.innerHTML = `<span></span>${stgFormLink(stg, false)}`;
    cbody.appendChild(f);
    return card;
  }

  const cur = records[0];
  const prev = records[1] || null;

  // 表示状態が今のデータと噛み合わない場合(選手切替直後・データ更新後など)は全体画面に戻す。
  let mode = stgView.mode;
  if (mode === "record" && !records[stgView.recIndex]) mode = "overview";
  if (mode === "history" && records.length <= 2) mode = "overview";
  if (mode === "detail") {
    const hasCat = (cur.categories && cur.categories[stgView.cat]) || (prev && prev.categories && prev.categories[stgView.cat]);
    if (!hasCat) mode = "overview";
  }

  if (mode === "history") stgRenderHistory(cbody, records);
  else if (mode === "record") stgRenderRecord(cbody, records[stgView.recIndex]);
  else if (mode === "detail") stgRenderDetail(cbody, stg, records, cur, prev, stgView.cat);
  else if (stgIsV2(cur)) stgRenderOverviewV2(cbody, stg, records, cur, prev);
  else stgRenderOverview(cbody, stg, records, cur, prev);

  return card;
}

// ---------- 全体（オーバービュー） ----------
function stgRenderOverview(cbody, stg, records, cur, prev) {
  // 月が特定できない(＝まだ未回答の)1件だけのときはチップを出さない。
  const showChips = !!(stgRecLabel(cur) || prev);
  if (showChips || records.length > 2) {
    const head = document.createElement("div");
    head.className = "rec-head";
    head.innerHTML =
      (showChips ?
        '<span class="rec-chips">' +
          '<span class="rec-chip now">' + escHtml(stgChipText("今回", cur)) + '</span>' +
          (prev ? '<span class="rec-chip-sep">/</span><span class="rec-chip prev">' + escHtml(stgChipText("前回", prev)) + '</span>' : '') +
        '</span>' : '<span></span>') +
      (records.length > 2 ? '<a class="mandala-link" href="javascript:void(0)" onclick="stgGo(\'history\')">これまでの記録 ›</a>' : '<span></span>');
    cbody.appendChild(head);
  }

  if (cur.reflection) cbody.appendChild(stgMakeReviewBox(cur.reflection, prev));

  // 3カテゴリのタイル（今回 + 前回を1枚に）
  const grid = document.createElement("div");
  grid.className = "goal-grid";
  STG_CATEGORIES.forEach(function (cat) {
    const c = cur.categories ? cur.categories[cat] : null;
    const p = (prev && prev.categories) ? prev.categories[cat] : null;
    const nowWant = stgVal(c && c.wantToDo);
    const prevWant = stgVal(p && p.wantToDo);
    const tile = document.createElement("div");
    const hasAny = !!(c || p);
    tile.className = "goal-tile" + (hasAny ? " clickable" : " muted");
    if (hasAny) {
      tile.innerHTML =
        '<div class="k">' + escHtml(cat) + '</div>' +
        (nowWant ? '<div class="now-line"><span class="tag now">今回</span>' + escHtml(nowWant) + '</div>' : '') +
        (prevWant ? '<div class="prev-line' + (nowWant ? '' : ' first') + '"><span class="tag prev">前回</span>' + escHtml(prevWant) + '</div>' : '') +
        (!nowWant && !prevWant ? '<div class="v" style="color:var(--text-muted);">（回答なし）</div>' : '');
      tile.onclick = function () { window.stgGo("detail", cat); };
    } else {
      tile.innerHTML = '<div class="k">' + escHtml(cat) + '</div><div class="v" style="color:var(--text-muted);">まだ回答がありません</div>';
    }
    grid.appendChild(tile);
  });
  cbody.appendChild(grid);

  // 練習計画（今回）
  const planTitle = document.createElement("div");
  planTitle.className = "sec-title";
  planTitle.textContent = "練習計画（今回）";
  cbody.appendChild(planTitle);

  const p = cur.plan;
  if (p) {
    const planGrid = document.createElement("div");
    planGrid.className = "goal-grid";
    planGrid.innerHTML =
      '<div class="goal-tile"><div class="k">練習頻度・時間</div><div class="v">' + escHtml(stgVal(p.frequency) || "（回答なし）") + '</div></div>' +
      '<div class="goal-tile"><div class="k">サポートしてほしいこと</div><div class="v">' + escHtml(stgVal(p.support) || "（回答なし）") + '</div></div>';
    cbody.appendChild(planGrid);

    if (stgVal(p.wish) || stgVal(p.message)) {
      const f = document.createElement("div");
      f.className = "field";
      f.innerHTML =
        (stgVal(p.wish) ? '<div class="k">モーグルの楽しさを広めたいこと</div><div class="v">' + escHtml(p.wish) + '</div>' : '') +
        (stgVal(p.message) ? '<div class="k" style="margin-top:8px;">最後にひとこと</div><div class="v">' + escHtml(p.message) + '</div>' : '');
      cbody.appendChild(f);
    }
  } else {
    const empty = document.createElement("div");
    empty.className = "mandala-empty";
    empty.style.paddingTop = "0";
    empty.textContent = "まだ回答がありません。";
    cbody.appendChild(empty);
  }

  const actions = document.createElement("div");
  actions.innerHTML = stgFormActions(stg);
  cbody.appendChild(actions.firstChild);

  const footer = document.createElement("div");
  footer.className = "mandala-summary";
  footer.innerHTML =
    '<span>' + (cur.updated ? "更新日 " + escHtml(cur.updated) : "まだ回答がありません") + '</span>' +
    '<span>' +
      (stg.sheetUrl ? '<a class="mandala-link" href="' + stg.sheetUrl + '" target="_blank" rel="noopener">全回答を見る →</a>' : '') +
    '</span>';
  cbody.appendChild(footer);
}

// ---------- 全体（フォームB v2） ----------
function stgRenderOverviewV2(cbody, stg, records, cur, prev) {
  const showChips = !!(stgRecLabel(cur) || prev);
  if (showChips || records.length > 2) {
    const head = document.createElement("div");
    head.className = "rec-head";
    head.innerHTML =
      (showChips ?
        '<span class="rec-chips">' +
          '<span class="rec-chip now">' + escHtml(stgChipText("今回", cur)) + '</span>' +
          (prev ? '<span class="rec-chip-sep">/</span><span class="rec-chip prev">' + escHtml(stgChipText("前回", prev)) + '</span>' : '') +
        '</span>' : '<span></span>') +
      (records.length > 2 ? '<a class="mandala-link" href="javascript:void(0)" onclick="stgGo(\'history\')">これまでの記録 ›</a>' : '<span></span>');
    cbody.appendChild(head);
  }

  if (cur.reflection) cbody.appendChild(stgMakeReviewBox(cur.reflection, prev));

  const title = document.createElement("div");
  title.className = "sec-title";
  title.textContent = "次の短期目標";
  cbody.appendChild(title);

  const mode = cur.goalMode || null;
  if (mode === "complete" || mode === "consult") {
    const box = document.createElement("div");
    box.className = "field";
    box.innerHTML =
      '<div class="k">目標の扱い</div>' +
      '<div class="v">' + escHtml(STG_GOAL_MODE_LABEL[mode] || "") +

      '</div>';
    cbody.appendChild(box);
  } else {
    const resolved = stgResolveGoal(records, 0);
    const focus = stgResolveFocus(records, 0);
    const continued = !!(resolved.from && resolved.from !== cur);

    // 重点課題・場所・継続を同じ行にまとめる（横幅を超えたら折り返す）
    const chips = stgChipsHtml(
      focus,
      stgReviewChip(resolved.goal) +
      (continued
        ? '<span class="rec-chip prev">継続' + (stgRecLabel(resolved.from) ? "（" + escHtml(stgRecLabel(resolved.from)) + "から）" : "") + '</span>'
        : "")
    );
    if (chips) {
      const head2 = document.createElement("div");
      head2.className = "rec-head";
      head2.innerHTML = chips + '<span></span>';
      cbody.appendChild(head2);
    }

    if (stgGoalHasContent(resolved.goal)) {
      STG_V2_GOAL_FIELDS.forEach(function (pair) {
        const v = stgVal(resolved.goal[pair[0]]);
        if (!v) return;
        const f = document.createElement("div");
        f.className = "field";
        f.innerHTML = '<div class="k">' + escHtml(pair[1]) + '</div><div class="v">' + escHtml(v) + '</div>';
        cbody.appendChild(f);
      });

      const empty = document.createElement("div");
      empty.className = "mandala-empty";
      empty.style.paddingTop = "0";
      empty.textContent = "まだ目標が書かれていません。";
      cbody.appendChild(empty);
    }
  }

  const common = cur.common || {};
  const extra = [
    ["competitionAction", "大会・シーズンに向けて実行すること"],
    ["worry", "心配なこと・不安なこと"],
    ["support", "コーチにサポートしてほしいこと"]
  ].filter(function (pair) { return !!stgVal(common[pair[0]]); });
  if (extra.length) {
    const t2 = document.createElement("div");
    t2.className = "sec-title";
    t2.textContent = "そのほか";
    cbody.appendChild(t2);
    extra.forEach(function (pair) {
      const f = document.createElement("div");
      f.className = "field";
      f.innerHTML = '<div class="k">' + escHtml(pair[1]) + '</div><div class="v">' + escHtml(stgVal(common[pair[0]])) + '</div>';
      cbody.appendChild(f);
    });
  }

  const actions = document.createElement("div");
  actions.innerHTML = stgFormActions(stg);
  cbody.appendChild(actions.firstChild);

  const footer = document.createElement("div");
  footer.className = "mandala-summary";
  footer.innerHTML =
    '<span>' + (cur.updated ? "更新日 " + escHtml(cur.updated) : "") + '</span>' +
    '<span>' +
      (stg.sheetUrl ? '<a class="mandala-link" href="' + stg.sheetUrl + '" target="_blank" rel="noopener">全回答を見る →</a>' : '') +
    '</span>';
  cbody.appendChild(footer);
}

// ---------- 振り返りブロック（前回の目標に対するふりかえり） ----------
function stgMakeReviewBox(r, prev) {
  const box = document.createElement("div");
  box.className = "review-box";

  const prevLabel = stgRecLabel(prev);
  const title = document.createElement("div");
  title.className = "rb-title";
  title.textContent = prevLabel ? "前回（" + prevLabel + "）の目標のふりかえり" : "前回の目標のふりかえり";
  box.appendChild(title);

  const achv = document.createElement("div");
  achv.className = "rb-achv";
  achv.innerHTML = '<span class="lab">達成度</span><span class="val">' + escHtml(stgVal(r.achievement) || "（回答なし）") + '</span>';
  box.appendChild(achv);

  const shown = stgReviewOpen ? STG_REVIEW_FIELDS : STG_REVIEW_FIELDS.slice(0, 2);
  shown.forEach(function (pair) {
    const v = stgVal(r[pair[0]]);
    if (!v) return;
    const row = document.createElement("div");
    row.className = "review-row";
    row.innerHTML = '<div class="k">' + escHtml(pair[1]) + '</div><div class="v">' + escHtml(v) + '</div>';
    box.appendChild(row);
  });

  const hidden = STG_REVIEW_FIELDS.slice(2).filter(function (pair) { return !!stgVal(r[pair[0]]); }).length;
  if (hidden > 0) {
    const more = document.createElement("div");
    more.className = "rb-more";
    more.innerHTML = '<a class="mandala-link" href="javascript:void(0)" onclick="stgToggleReview()">' +
      (stgReviewOpen ? "とじる ▲" : "ふりかえりをすべて見る（あと" + hidden + "件） ▼") + '</a>';
    box.appendChild(more);
  }
  return box;
}

      '<div class="m">' + escHtml(stgRecLabel(rec) || "記録") + badge + '</div>' +

    item.onclick = function () { window.stgGo("record", i); };
    list.appendChild(item);
  });
  cbody.appendChild(list);
}

const MAIN_EXERCISES = ["スクワット", "ベンチプレス", "懸垂", "デッドリフト", "ベントオーバーバーベルロー", "腹筋種目"];

function makeTrainingCard(a, athleteKey) {
  const card = makeCard("ウエイトトレーニング", "blue", "");
  const cbody = card.querySelector(".card-body");

  if (!a.training) {
    cbody.innerHTML = `<div class="mandala-empty">まだトレーニングログアプリが作られていません。</div>`;
    return card;
  }

  loadTraining(athleteKey, a.training.apiUrl); // 既に読み込み中/済みなら何もしない
  const cache = trainingCache[athleteKey];

  if (!cache || cache.status === "loading") {
    cbody.innerHTML = `<div class="mandala-empty">読み込み中…</div>`;
    return card;
  }
  if (cache.status === "error") {
    cbody.innerHTML = `
      <div class="mandala-empty">データを取得できませんでした（${cache.error}）。</div>
      <div class="mandala-summary">
        <a class="mandala-link" href="javascript:void(0)" onclick="retryTraining('${athleteKey}')">再読み込み →</a>
        <a class="mandala-link" href="${a.training.appUrl}" target="_blank" rel="noopener">アプリを開く →</a>
      </div>
    `;
    return card;
  }

  const byExercise = groupTrainingByExercise(cache.records);

  if (trainingDrill && byExercise[trainingDrill]) {
    // Detail view: 選んだ種目の直近セッション履歴 + 次回の目標
    const byDate = byExercise[trainingDrill];
    const dates = Object.keys(byDate).sort().reverse().slice(0, 3); // 直近3セッション

    const header = document.createElement("div");
    header.className = "mandala-summary";
    header.style.marginTop = "0";
    header.style.marginBottom = "8px";
    header.innerHTML = `<a class="mandala-link" href="javascript:void(0)" onclick="trainingBack()">← 全体に戻る</a><span>${trainingDrill}</span>`;
    cbody.appendChild(header);

    dates.forEach(date => {
      // 同じ日に複数のサブ種目(note違い、例:腹筋のアブローラー/オリジナル腹筋)が混在する場合は分けて表示
      const groups = [];
      const groupIndex = {};
      byDate[date].forEach(s => {
        const key = s.note || "";
        if (!(key in groupIndex)) { groupIndex[key] = groups.length; groups.push({ note: key, sets: [] }); }
        groups[groupIndex[key]].sets.push(s);
      });
      groups.forEach(g => {
        const setsText = g.sets.map(s => {
          const w = s.weight ? `${s.weight}kg×` : "";
          return `${w}${s.reps}回(RPE${s.rpe ?? "-"})`;
        }).join(" / ");
        const topEpley = Math.max(0, ...g.sets.filter(s => s.weight).map(s => epley1RM(s.weight, s.reps) || 0));
        const f = document.createElement("div");
        f.className = "field";
        f.innerHTML = `
          <div class="k">${date}${g.note ? "・" + g.note : ""}</div>

        `;
        cbody.appendChild(f);
      });
    });

    const nt = nextTarget(trainingDrill, byDate[dates[0]]);
    if (nt) {
      const box = document.createElement("div");
      box.className = "message-box";
      box.innerHTML = `<div class="k">次回の目標</div>${nt.weight}kg × 8〜12回 × 3セット<br><span style="font-weight:400;">${nt.note}</span>`;
      cbody.appendChild(box);
    }

    const footer = document.createElement("div");
    footer.className = "mandala-summary";
    footer.innerHTML = `<span></span><a class="mandala-link" href="${a.training.appUrl}" target="_blank" rel="noopener">アプリで全履歴・グラフを見る →</a>`;
    cbody.appendChild(footer);
    return card;
  }

  // Overview: 種目ごとのタイル（タップで直近セッション履歴にドリルダウン）
  const grid = document.createElement("div");
  grid.className = "goal-grid";
  MAIN_EXERCISES.forEach(ex => {
    const byDate = byExercise[ex];
    const latest = byDate ? latestSession(byDate) : null;
    const tile = document.createElement("div");
    tile.className = "goal-tile clickable" + (latest ? "" : " muted");
    if (!latest) { tile.className = tile.className.replace(" clickable", ""); }
    if (latest) {
      const topSet = latest.sets.reduce((max, s) => (s.weight || 0) > (max.weight || 0) ? s : max, latest.sets[0]);
      const epley = epley1RM(topSet.weight, topSet.reps);
      const valueText = topSet.weight
        ? `${latest.date}・推定1RM ${epley}kg`
        : `${latest.date}・${latest.sets.reduce((sum, s) => sum + s.reps, 0)}回`;
      tile.innerHTML = `<div class="k">${ex}</div><div class="v">${valueText}</div>`;
      tile.onclick = () => selectTraining(ex);
    } else {
      tile.innerHTML = `<div class="k">${ex}</div><div class="v" style="color:var(--text-muted);">まだ記録なし</div>`;
    }
    grid.appendChild(tile);
  });
  cbody.appendChild(grid);

  const footer = document.createElement("div");
  footer.className = "mandala-summary";
  footer.innerHTML = `<span></span><a class="mandala-link" href="${a.training.appUrl}" target="_blank" rel="noopener">アプリを開く →</a>`;
  cbody.appendChild(footer);
  const hint = document.createElement("div");
  hint.style.cssText = "font-size:10.5px;color:var(--text-muted);margin-top:4px;text-align:center;";
  hint.textContent = "記録のある種目をタップすると、直近の履歴を見られます";
  cbody.appendChild(hint);

  return card;
}

// MICエアlog(ウォータージャンプ・トランポリン記録アプリ)関連ヘルパー
const AIR_LOG_CATEGORIES = [
  ["water", "ウォータージャンプ"],
  ["trampoline", "トランポリン"]
];

// MICエアlogの実APIは「セッション(record)ごとに複数の技行(rows)を入れ子で持つ」構造。
// record: {athleteName, category, date, facility, kicker, note, rows:[...]}
// row: {trickId, modifier, nuki, unnatural, success(本数), fail(本数), kakari, airtimeSeconds}
// success/failは本数(数値)。特殊技 "airtime"(10本ジャンプ)はsuccess/failを持たずairtimeSecondsのみ。
// 技名はMICエアlogアプリ本体のカタログと同じ表記に揃える。
const AIRLOG_TRICK_LABELS = {
  straight_jump: "ストレートジャンプ",
  rot_3: "360", rot_7: "720", rot_10: "1080",
  oax_3: "オフアクシス360", oax_7: "オフアクシス720", oax_10: "オフアクシス1080", oax_14: "オフアクシス1440",
  inv_bt: "バックタック", inv_bp: "バックパイク", inv_bl: "バックレイアウト",
  inv_bf: "バックフル", inv_bdf: "バックダブルフル", inv_btf: "バックトリプルフル",
  inv_ft: "フロントタック", inv_fp: "フロントパイク", inv_ff: "フロントフル",
  loop_l: "ループ", airtime: "10本ジャンプ",
  inv_bpt: "バックタック/パイク", inv_fpt: "フロントタック/パイク"
};
const AIRLOG_MODIFIER_LABELS = { none: "", position: "ポジション", G: "G", g: "g" };

function airLogIsAirtime(row) { return row && row.trickId === "airtime"; }

function airLogTrickName(row) {
  if (!row) return "(技名未記入)";
  let name = AIRLOG_TRICK_LABELS[row.trickId] || row.trickId || "(技名未記入)";
  const mod = AIRLOG_MODIFIER_LABELS[row.modifier];
  if (mod) name += " " + mod;
  if (row.nuki) name += "・抜き";
  if (row.unnatural) name += "・アンナチュラル";
  return name;
}

// 1行の本数を返す。ウォータージャンプはsuccess/fail(成功/失敗本数)、
// トランポリンはreps(本数、成功/失敗の区別なし)。airtime(10本ジャンプ)は別扱いなのでここには来ない。
function airLogHon(row) {
  const hasSF = (row.success != null || row.fail != null);
  if (hasSF) {
    const s = Number(row.success) || 0, f = Number(row.fail) || 0;
    return { hon: s + f, success: s, hasSuccess: true };
  }
  return { hon: Number(row.reps) || 0, success: 0, hasSuccess: false };
}

function groupAirLogByCategory(records, matchName) {
  const target = (matchName || "").trim();
  const mine = (records || []).filter(r => (r.athleteName || "").trim() === target);
  const byCat = { water: [], trampoline: [] };
  mine.forEach(r => {
    if (byCat[r.category]) byCat[r.category].push(r);
  });
  return byCat;
}

// カテゴリ内の全セッション(records)から、通常技の本数(success+fail)・成功数、最新日、
// 10本ジャンプ(airtime)の最新滞空秒を集計する。
function airLogCatStats(records) {
  let success = 0, total = 0, latestDate = "", latestAirtime = null, airtimeDate = "";
  let hasSuccess = false, kakari = 0;
  (records || []).forEach(rec => {
    if (rec.date && rec.date > latestDate) latestDate = rec.date;
    (rec.rows || []).forEach(row => {
      if (airLogIsAirtime(row)) {
        const sec = parseFloat(row.airtimeSeconds);
        if (!isNaN(sec) && (rec.date || "") >= airtimeDate) { latestAirtime = sec; airtimeDate = rec.date || ""; }
        return;
      }
      const c = airLogHon(row);
      total += c.hon;
      if (c.hasSuccess) { success += c.success; hasSuccess = true; }
      if (row.kakari) kakari += c.hon; // かかり本数(かかりONの行の本数合計)
    });
  });
  return { success, total, latestDate, latestAirtime, hasSuccess, kakari };
}

// ドリルダウン用: セッション(record)を新しい順に、技名→{success,total本}・10本ジャンプ秒・メモにまとめる。
function airLogSessionsStats(records) {
  const sessions = (records || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return sessions.map(rec => {
    const tricks = {};
    let airtimeSec = null;
    (rec.rows || []).forEach(row => {
      if (airLogIsAirtime(row)) {
        const sec = parseFloat(row.airtimeSeconds);
        if (!isNaN(sec)) airtimeSec = sec;
        return;
      }
      const name = airLogTrickName(row);
      if (!tricks[name]) tricks[name] = { success: 0, total: 0, hasSuccess: false, kakari: 0 };
      const c = airLogHon(row);
      tricks[name].total += c.hon;
      if (c.hasSuccess) { tricks[name].success += c.success; tricks[name].hasSuccess = true; }
      if (row.kakari) tricks[name].kakari += c.hon;
    });
    const notes = rec.note ? [rec.note] : [];
    return { date: rec.date || "", facility: rec.facility || "", tricks, airtimeSec, notes };
  });
}

// 短期目標(フォームA)の「挑戦したい技」をMICエアlogカードに表示するためのヘルパー。
// stgCacheが未読み込み(loading)・エラー・短期目標フォーム自体が無い場合はnullを返し、
// その場合エアlog側は「挑戦したい技」の表示を省略する(エアlogカード自体の表示はブロックしない)。
function getStgCategoriesForAirLog(a, athleteKey) {
  const stg = a.shortTermGoal;
  if (!stg) return null;
  let data = null;
  if (stg.apiUrl) {
    const cache = stgCache[athleteKey];
    if (!cache || cache.status !== "loaded") return null;
    data = cache.data;
  } else {
    data = stg;
  }
  if (!data) return null;

  // フォームB v2: 「重点課題がエア」かつ「取り組む場所にWJ/トランポリンが入っている」場合だけ出す。
  // v2の目標は技名とは限らないため、ラベルは「今回のエア目標」にする。
  const records = stgBuildRecords(data);
  if (records.length && stgIsV2(records[0])) {
    const focus = stgResolveFocus(records, 0);
    const goal = stgResolveGoal(records, 0).goal;
    const want = stgVal(goal && goal.wantToDo);
    if (!focus || focus.main !== "エア" || !want) return null;
    const out = {};
    (focus.venues || []).forEach(function (v) {
      const label = STG_V2_VENUE_TO_AIRLOG[v];
      if (label) out[label] = { wantToDo: want, label: "今回のエア目標" };
    });
    return Object.keys(out).length ? out : null;
  }
  return data.categories || null;
}

// エアlogを「選手専用リンク」(?a=<エアlogの選手ID>)で開く。
// 選手が他の選手の記録として入力してしまうのを防ぐため。エアlog側は ?a= が付いていると
// 記録タブが本人固定になり、他の選手のメモも見えなくなる。
// コーチ画面では付けない(記録タブが特定の選手に固定されてしまうため)。
// IDはエアlogのAPIが返す名簿から氏名一致で引く。読み込み前や見つからないときは共通URLに落とす
// (存在しないIDを渡すとエアlog側が「名簿に見つかりません」と出して記録タブを止めるため、
//  黙って共通URLで開かせる方が実害が小さい)。
function airLogAppUrlFor(airLog) {
  const base = (airLog && airLog.appUrl) || AIRLOG_APP_URL;
  if (VIEW_MODE !== "player" || !airLog || !airLog.apiUrl) return base;
  const cache = airLogCache[airLog.apiUrl];
  if (!cache || cache.status !== "loaded") return base;
  const hit = (cache.athletes || []).filter(function (x) { return x && x.name === airLog.matchName; })[0];
  return (hit && hit.id) ? base + "?a=" + encodeURIComponent(hit.id) : base;
}

function makeAirLogCard(a, athleteKey) {
  const card = makeCard("MICエアlog", "blue", "");

  if (!airLog || !airLog.apiUrl) {

  }

  const stgCategories = getStgCategoriesForAirLog(a, athleteKey);

  const cache = airLogCache[airLog.apiUrl];

  if (!cache || cache.status === "loading") {
    cbody.innerHTML = `<div class="mandala-empty">読み込み中...</div>`;
    return card;
  }
  if (cache.status === "error") {
    cbody.innerHTML = "";
    const summary = document.createElement("div");
    summary.className = "mandala-summary";
    summary.innerHTML = `<span>読み込みに失敗しました</span><a class="mandala-link" href="javascript:void(0)" onclick="window.retryAirLog('${airLog.apiUrl}')">再読み込み →</a>`;

  }

  const byCat = groupAirLogByCategory(cache.records, airLog.matchName);

  if (airLogDrill && (airLogDrill === "water" || airLogDrill === "trampoline")) {
    const catLabel = AIR_LOG_CATEGORIES.find(c => c[0] === airLogDrill)[1];
    const rows = byCat[airLogDrill];
    const back = document.createElement("div");
    back.style.cssText = "margin-bottom:8px;";
    back.innerHTML = `<a class="mandala-link" href="javascript:void(0)" onclick="window.airLogBack()">← 全体に戻る</a>`;
    cbody.appendChild(back);

    const drillStgCat = stgCategories && stgCategories[catLabel];
    if (drillStgCat && drillStgCat.wantToDo) {
      const wantBox = document.createElement("div");
      wantBox.className = "field sub";
      wantBox.innerHTML = `<div class="k">${drillStgCat.label || "挑戦したい技"}(短期目標より)</div><div class="v">${drillStgCat.wantToDo}</div>`;
      cbody.appendChild(wantBox);
    }

    if (!rows.length) {
      cbody.innerHTML += `<div class="mandala-empty">${catLabel}の記録はまだありません</div>`;
    } else {
      const sessions = airLogSessionsStats(rows).slice(0, 5);
      sessions.forEach(s => {
        const sess = document.createElement("div");
        sess.className = "field";
        const parts = Object.keys(s.tricks).map(t => {
          const ts = s.tricks[t];
          let str = ts.hasSuccess ? `${t}: ${ts.success}/${ts.total}本` : `${t}: ${ts.total}本`;
          if (ts.kakari > 0) str += `(かかり${ts.kakari}/${ts.total})`;
          return str;
        });
        if (s.airtimeSec != null) parts.push(`10本ジャンプ: ${s.airtimeSec}秒`);
        const trickLines = parts.length ? parts.join("<br>") : "(記録内容なし)";
        const noteLine = s.notes.length ? `<div style="margin-top:4px;color:var(--text-muted);font-size:11px;">${s.notes.join(" / ")}</div>` : "";
        sess.innerHTML = `<div class="k">${s.date}${s.facility ? " ・ " + s.facility : ""}</div><div class="v">${trickLines}${noteLine}</div>`;
        cbody.appendChild(sess);
      });
    }

    const footer = document.createElement("div");
    footer.className = "mandala-summary";
    footer.innerHTML = `<span></span><a class="mandala-link" href="${airLogAppUrlFor(airLog)}" target="_blank" rel="noopener">アプリで全履歴を見る →</a>`;
    cbody.appendChild(footer);
    return card;
  }

  const grid = document.createElement("div");
  grid.className = "goal-grid";
  AIR_LOG_CATEGORIES.forEach(([key, label]) => {
    const rows = byCat[key];
    const tile = document.createElement("div");
    const tileStgCat = stgCategories && stgCategories[label];
    const wantHtml = tileStgCat && tileStgCat.wantToDo
      ? `<div style="font-size:10.5px;color:var(--blue-450);font-weight:700;margin-bottom:3px;">${tileStgCat.label || "挑戦したい技"}: ${tileStgCat.wantToDo}</div>`
      : "";
    if (rows.length) {
      const stats = airLogCatStats(rows);
      const lines = [`最新: ${stats.latestDate || "-"}`];
      if (stats.hasSuccess) lines.push(`成功 ${stats.success}/${stats.total}本`);
      else if (stats.total > 0) lines.push(`本数 ${stats.total}本`);
      if (stats.latestAirtime != null) lines.push(`10本ジャンプ 最新${stats.latestAirtime}秒`);
      if (stats.kakari > 0) lines.push(`かかり ${stats.kakari}/${stats.total}本`);
      tile.className = "goal-tile clickable";
      tile.onclick = () => window.selectAirLogCategory(key);
      tile.innerHTML = `<div class="k">${label}</div>${wantHtml}<div class="v">${lines.join("<br>")}</div>`;
    } else {
      tile.className = "goal-tile muted";
      tile.innerHTML = `<div class="k">${label}</div>${wantHtml}<div class="v" style="color:var(--text-muted);">まだ記録なし</div>`;
    }
    grid.appendChild(tile);
  });
  cbody.appendChild(grid);

  const footer = document.createElement("div");
  footer.className = "mandala-summary";
  footer.innerHTML = `<span></span><a class="mandala-link" href="${airLogAppUrlFor(airLog)}" target="_blank" rel="noopener">アプリを開く →</a>`;
  cbody.appendChild(footer);

  return card;
}

function escHtml(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// linkedEntryId/linkedRowIdから、元になった技行(トリック・本数など)をrecordsの中から探す。
function airLogFindRecordRow(records, entryId, rowId) {
  if (!entryId || !rowId) return null;
  const rec = (records || []).find(function (r) { return r.id === entryId; });
  if (!rec) return null;
  const row = (rec.rows || []).find(function (rw) { return rw.rowId === rowId; });
  if (!row) return null;
  return { rec: rec, row: row };
}

// entryId+rowIdに紐づく動画(success/fail/singleいずれの種別も)をすべて集める。リンクのみ表示(サムネイルなし)。
function airLogVideosForRow(videos, entryId, rowId) {
  if (!entryId || !rowId) return [];
  const typeLabel = { success: "成功", fail: "失敗", single: "動画" };
  return (videos || []).filter(function (v) { return v.entryId === entryId && v.rowId === rowId; })
    .map(function (v, i) { return { url: v.sharedUrl, label: (typeLabel[v.type] || "動画") + (i > 0 ? (i + 1) : "") }; });
}

  const airLog = a.airLog;
  if (!airLog || !airLog.apiUrl) {
    cbody.innerHTML = '<div class="mandala-empty">MICエアlogは未連携です</div>';
    return card;
  }
  loadAirLog(airLog.apiUrl);
  const cache = airLogCache[airLog.apiUrl];
  if (!cache || cache.status === "loading") {
    cbody.innerHTML = '<div class="mandala-empty">読み込み中...</div>';
    return card;
  }
  if (cache.status === "error") {
    cbody.innerHTML = '<div class="mandala-empty">読み込みに失敗しました</div>';
    return card;
  }
  const athleteRec = (cache.athletes || []).find(function (x) { return x.name === airLog.matchName; });
  const athleteId = athleteRec ? athleteRec.id : "";
  const notes = (cache.coachNotes || []).filter(function (n) { return athleteId && n.athleteId === athleteId; });

  // linkedEntryId+linkedRowId単位でスレッド化。両方空のものは「その他の伝言」スレッドにまとめる。
  const threadOrder = [];
  const threadMap = {};
  notes.forEach(function (n) {
    const key = (n.linkedEntryId || "") + "|" + (n.linkedRowId || "");
    if (!threadMap[key]) { threadMap[key] = { entryId: n.linkedEntryId || "", rowId: n.linkedRowId || "", items: [] }; threadOrder.push(key); }
    threadMap[key].items.push(n);
  });
  threadOrder.forEach(function (key) {
    threadMap[key].items.sort(function (x, y) {
      const ca = x.createdAt || "", cb = y.createdAt || "";
      if (ca < cb) return -1;
      if (ca > cb) return 1;
      return 0;
    });
  });
  // スレッドは最新メッセージが新しい順。「その他の伝言」(rowId無し)は末尾固定。
  threadOrder.sort(function (k1, k2) {
    const t1 = threadMap[k1], t2 = threadMap[k2];
    if (!t1.rowId && t2.rowId) return 1;
    if (t1.rowId && !t2.rowId) return -1;
    const last1 = t1.items[t1.items.length - 1].createdAt || "";
    const last2 = t2.items[t2.items.length - 1].createdAt || "";
    if (last1 < last2) return 1;
    if (last1 > last2) return -1;
    return 0;
  });

  let bodyHtml = "";
  if (!threadOrder.length) {
    bodyHtml = '<div class="mandala-empty">共有メモはまだありません</div>';
  } else {
    bodyHtml = threadOrder.map(function (key, ti) {
      const t = threadMap[key];
      const isGeneral = !t.rowId;
      const found = !isGeneral ? airLogFindRecordRow(cache.records, t.entryId, t.rowId) : null;
      const bestNote = t.items.find(function (n) { return n.isBestOfDay; });
      let headerHtml, subHtml = "", videoLinksHtml = "";
      if (isGeneral) {
        headerHtml = '<div class="coachnote-general-heading">その他の伝言</div>';
      } else {
        const trickLabel = found ? escHtml(airLogTrickName(found.row)) : "(記録が見つかりません)";
        const honInfo = found ? airLogHon(found.row) : null;
        const honLabel = honInfo ? (honInfo.hasSuccess ? (honInfo.success + "/" + honInfo.hon + "本") : (honInfo.hon + "本")) : "";
        headerHtml = '<div class="coachnote-thread-header">' + trickLabel + (bestNote ? '<span class="coachnote-best-badge">★ 今日のベスト</span>' : '') + '</div>';
        subHtml = '<div class="coachnote-thread-sub">' + (found ? escHtml(found.rec.date || "") + (honLabel ? " ・ " + honLabel : "") : "") + '</div>';
        const vids = airLogVideosForRow(cache.videos, t.entryId, t.rowId);
        if (vids.length) {
          videoLinksHtml = '<div class="coachnote-video-links">' + vids.map(function (v) {
            return '<a class="coachnote-video-link" href="' + escHtml(v.url) + '" target="_blank" rel="noopener noreferrer">▶ ' + escHtml(v.label) + 'を見る</a>';
          }).join("") + '</div>';
        }
      }
      const bubblesHtml = '<div class="coachnote-bubbles">' + t.items.map(function (n) {
        const isCoach = n.source === "coach";
        const who = isCoach ? "コーチ" : "選手";
        const text = n.text ? escHtml(n.text) : '<em>(コメントなし)</em>';
        return '<div class="coachnote-bubble ' + (isCoach ? "coach" : "athlete") + '"><div class="who">' + escHtml(who) + ' ・ ' + escHtml(n.createdAt || "") + '</div><div class="txt">' + text + '</div></div>';
      }).join("") + '</div>';
      const threadKey = athleteKey + "_" + ti;
      const replyHtml = '<div class="coachnote-reply-row">' +
        '<textarea class="coachnote-reply-input" id="coachReplyInput_' + threadKey + '" rows="1" placeholder="返信する"></textarea>' +
        '<button class="coachnote-reply-btn" id="coachReplyBtn_' + threadKey + '" onclick="submitCoachReply(\'' + athleteKey + "','" + athleteId + "','" + escAttrJs(t.entryId) + "','" + escAttrJs(t.rowId) + "','" + threadKey + '\')">送信</button>' +
        '</div><div class="coachnote-status" id="coachReplyStatus_' + threadKey + '"></div>';
      return '<div class="coachnote-thread">' + headerHtml + subHtml + videoLinksHtml + bubblesHtml + replyHtml + '</div>';
    }).join("");
  }

  cbody.innerHTML = bodyHtml +
    '<div class="coachnote-general-heading">新しい伝言を送る</div>' +
    '<textarea class="coachnote-input" id="coachNoteInput_' + athleteKey + '" rows="2" placeholder="特定の技に紐づかない伝言はこちらから"></textarea>' +
    '<button class="coachnote-btn" onclick="submitCoachNote(\'' + athleteKey + "','" + athleteId + '\')">送信する</button>' +
    '<div class="coachnote-status" id="coachNoteStatus_' + athleteKey + '"></div>';

  if (!athleteId) {
    const btn = cbody.querySelector(".coachnote-btn");
    if (btn) btn.disabled = true;
  }

  return card;
}

// onclick文字列に安全に埋め込むための簡易エスケープ(シングルクォート/バックスラッシュのみ)。
function escAttrJs(str) {
  return String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function submitCoachNote(athleteKey, athleteId) {
  if (!athleteId) return;
  const a = ATHLETES[athleteKey];
  const apiUrl = a && a.airLog && a.airLog.apiUrl;
  if (!apiUrl) return;
  const input = document.getElementById("coachNoteInput_" + athleteKey);
  const statusEl = document.getElementById("coachNoteStatus_" + athleteKey);
  const text = (input && input.value ? input.value : "").trim();
  if (!text) return;
  if (statusEl) statusEl.textContent = "送信中...";
  const source = VIEW_MODE === "player" ? "athlete" : "coach";
  fetch(apiUrl, { method: "POST", body: JSON.stringify({ type: "addCoachNote", athleteId: athleteId, source: source, kind: "share", text: text }) })
    .then(function (res) { return res.json(); })
    .then(function (result) {
      if (result.status !== "ok") throw new Error(result.message || "failed");
      delete airLogCache[apiUrl];
      render();
    })
    .catch(function () {
      if (statusEl) statusEl.textContent = "送信に失敗しました。もう一度お試しください。";
    });
}

// 技行スレッドへの返信。選手専用モード(自分のカルテ)なら選手として、コーチ用モードならコーチとして送信する。
function submitCoachReply(athleteKey, athleteId, linkedEntryId, linkedRowId, threadKey) {
  if (!athleteId) return;
  const a = ATHLETES[athleteKey];
  const apiUrl = a && a.airLog && a.airLog.apiUrl;
  if (!apiUrl) return;
  const input = document.getElementById("coachReplyInput_" + threadKey);
  const statusEl = document.getElementById("coachReplyStatus_" + threadKey);
  const btn = document.getElementById("coachReplyBtn_" + threadKey);
  const text = (input && input.value ? input.value : "").trim();
  if (!text) return;
  if (btn) btn.disabled = true;
  if (statusEl) statusEl.textContent = "送信中...";
  const source = VIEW_MODE === "player" ? "athlete" : "coach";
  fetch(apiUrl, {
    method: "POST",
    body: JSON.stringify({ type: "addCoachNote", athleteId: athleteId, source: source, kind: "reply", text: text, linkedEntryId: linkedEntryId || "", linkedRowId: linkedRowId || "" }),
  })
    .then(function (res) { return res.json(); })
    .then(function (result) {
      if (result.status !== "ok") throw new Error(result.message || "failed");
      delete airLogCache[apiUrl];
      render();
    })
    .catch(function () {
      if (btn) btn.disabled = false;
      if (statusEl) statusEl.textContent = "送信に失敗しました。もう一度お試しください。";
    });
}

  }

function makeMandalaCard(m, mandalaState, mandalaApi, athleteKey) {
  const card = makeCard("マンダラチャート（目標達成シート）", "gold", "");
  const cbody = card.querySelector(".card-body");

  if (mandalaState && mandalaState.status === "loading") {
    cbody.innerHTML = `<div class="mandala-empty">読み込み中…</div>`;
    return card;
  }
  if (mandalaState && mandalaState.status === "error") {
    cbody.innerHTML = `
      <div class="mandala-empty">データを取得できませんでした（${mandalaState.error}）。</div>
      <div class="mandala-summary">
        <a class="mandala-link" href="javascript:void(0)" onclick="retryMandala('${athleteKey}')">再読み込み →</a>
        ${mandalaSourceLink(mandalaApi, "シートを開く")}
      </div>
    `;
    return card;
  }

  if (!m || !m.goal) {
    cbody.innerHTML = `
      <div class="mandala-empty">まだ着手前です。「マンダラチャート(記入用)」シートの中心マス(目標)から書き始めてもらいましょう。</div>
      <div class="mandala-summary">
        <span></span>
        ${mandalaSourceLink(mandalaApi, "シートを開く")}
      </div>
    `;
    return card;
  }

  const drillCell = mandalaDrill ? m.grid.find(c => c && c.name === mandalaDrill) : null;

  if (drillCell) {
    // Detail view: drillCell.name を中心に、その8マスの具体的な行動を表示
    const header = document.createElement("div");
    header.className = "mandala-summary";
    header.style.marginTop = "0";
    header.style.marginBottom = "8px";
    header.innerHTML = `
      <a class="mandala-link" href="javascript:void(0)" onclick="mandalaBack()">← 全体に戻る</a>
      <span>${countDone(drillCell.actions)}/8 記入済み</span>
    `;
    cbody.appendChild(header);

    const actions = drillCell.actions || new Array(8).fill(null);
    // actions の並び: [左上,上,右上,左,右,左下,下,右下]
    const cells9 = [
      actions[0], actions[1], actions[2],
      actions[3], "__CENTER__", actions[4],
      actions[5], actions[6], actions[7]
    ];
    const grid = document.createElement("div");
    grid.className = "mandala-3x3";
    cells9.forEach(v => {
      if (v === "__CENTER__") {
        grid.innerHTML += `<div class="mandala-cell center sub"><div class="g">${drillCell.name}</div></div>`;
      } else if (v) {
        grid.innerHTML += `<div class="mandala-cell action filled"><div class="a">${v}</div></div>`;
      } else {
        grid.innerHTML += `<div class="mandala-cell action"><div class="a muted">（未記入）</div></div>`;
      }
    });
    cbody.appendChild(grid);

    const footer = document.createElement("div");
    footer.className = "mandala-summary";
    footer.innerHTML = `
      <span></span>
      ${mandalaSourceLink(mandalaApi, "シートで編集する")}
    `;
    cbody.appendChild(footer);
    return card;
  }

  // Overview: 中心目標 + 8要素（タップで各要素の8マスにドリルダウン）
  const grid = document.createElement("div");
  grid.className = "mandala-3x3";
  let doneTotal = 0, cellTotal = 0;
  m.grid.forEach(cell => {
    if (cell === null) {
      grid.innerHTML += `<div class="mandala-cell center"><div class="g">${m.goal}</div></div>`;
      return;
    }
    const done = countDone(cell.actions);
    doneTotal += done;
    cellTotal += 8;
    const started = done > 0;
    grid.innerHTML += `
      <div class="mandala-cell elem clickable ${started ? 'started' : ''}" onclick="selectMandalaElement('${cell.name}')">
        <div class="n">${cell.name}</div>
        <div class="p">${done}/8${started ? '' : '・未着手'}</div>
      </div>
    `;
  });
  cbody.appendChild(grid);

  const summary = document.createElement("div");
  summary.className = "mandala-summary";
  summary.innerHTML = `
    <span>行動レベル ${doneTotal}/${cellTotal}マス記入済み・更新日 ${m.updated}</span>
    ${mandalaSourceLink(mandalaApi, "全81マスを見る")}
  `;
  cbody.appendChild(summary);
  const hint = document.createElement("div");
  hint.style.cssText = "font-size:10.5px;color:var(--text-muted);margin-top:4px;text-align:center;";
  hint.textContent = "各要素をタップすると、その8マスの内容を見られます";
  cbody.appendChild(hint);

  return card;
}

// 月経・周期に関する情報と共有設定は、選手用・コーチ用のどちらにも出さない。

function loadCondition(token, action) {
  const key = action + ":" + token;
  if (conditionCache[key]) return; // 読み込み中 or 読み込み済み
  conditionCache[key] = { status: "loading" };
  fetch(CONDITION_API_URL + "?token=" + encodeURIComponent(token) + "&action=" + action)
    .then(res => res.json())
    .then(data => {
      conditionCache[key] = { status: "loaded", data: data };
      render();
    })
    .catch(err => {
      conditionCache[key] = { status: "error", error: String(err) };
      render();
    });
}
window.retryCondition = function(token, action) {
  delete conditionCache[action + ":" + token];
  render();
};
window.condOpenAthlete = function(name) {
  conditionCoachOpen = name;
  render();
  window.scrollTo({ top: 0, behavior: "auto" });
};
window.condBackToList = function() {
  conditionCoachOpen = null;
  render();
};

// ローカル日付(端末のタイムゾーン)で yyyy-MM-dd を作る。UTCずれを避けるためtoISOStringは使わない。
function condToday() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function condShiftDate(dateStr, delta) {
  const p = dateStr.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + delta);
  const q = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + q(d.getMonth() + 1) + "-" + q(d.getDate());
}
function condDaysAgo(dateStr) {
  if (!dateStr) return null;
  const p = String(dateStr).split("-").map(Number);
  if (p.length !== 3 || isNaN(p[0])) return null;
  const then = new Date(p[0], p[1] - 1, p[2]);
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t0 - then) / 86400000);
}
function condMD(dateStr) {
  const p = String(dateStr).split("-");
  return p.length === 3 ? (Number(p[1]) + "/" + Number(p[2])) : dateStr;
}

// 確認優先度の判定。「体調の判定」ではなく「今日どの選手から声をかけるか」の目安。
// 記録が足りない選手は色を出さず“情報不足”として分ける(「危険」と「分からない」を同じ意味にしないため)。
function condJudge(r) {
  const days = r.daysSinceLastRecord;
  if (days === null || days === undefined || days >= 3 || (r.recentRecordCount || 0) < 2) {
    return { key: "gray", label: "記録不足", why: "最近の記録が足りないため、状態を判断する材料がありません。" };
  }
  const lf = (r.latestFatigue === null || r.latestFatigue === undefined) ? null : Number(r.latestFatigue);
  const af = (r.avgFatigue === null || r.avgFatigue === undefined) ? null : Number(r.avgFatigue);
  const high = (lf !== null && lf >= 5) || (af !== null && af >= 4.0);
  const elevated = (lf !== null && lf >= 4) || (af !== null && af >= 3.5);
  if (high && r.hasInjury) {
    return { key: "red", label: "優先確認", why: "疲労が高い記録と、ケガ・違和感の記録が重なっています。早めに本人に声をかけたい状態です。" };
  }
  if (elevated || r.hasInjury) {
    const bits = [];
    if (elevated) bits.push("疲労が高めの記録");
    if (r.hasInjury) bits.push("ケガ・違和感の記録");
    return { key: "amber", label: "確認あり", why: bits.join("と") + "があります。本人に聞いてみてください。" };
  }
  return { key: "green", label: "通常確認", why: "いまのところ、特に確認が必要な記録はありません。" };
}
function condFreshText(days) {
  if (days === null || days === undefined) return "記録なし";
  if (days === 0) return "今日 記録済み";
  if (days === 1) return "昨日まで記録";
  return days + "日前が最後";
}
