<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MIC資料室</title>
<style>
  :root {
    --surface-1: #ffffff;
    --page: #f4f5f7;
    --text-primary: #0b0b0b;
    --text-secondary: #55575c;
    --text-muted: #8a8d93;
    --gridline: #e7e8ec;
    --border: rgba(11,11,11,0.08);
    --blue-450: #2a78d6;
    --blue-250: #86b6ef;
    --blue-550: #1c5cab;
    --accent-soft: #eaf2fc;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    border-bottom: 1px solid var(--gridline);
  }
  .app-title { font-size: 17px; font-weight: 700; text-align: center; margin: 0; letter-spacing: 0.01em; }
  .app-sub { font-size: 11.5px; color: var(--text-muted); text-align: center; margin: 4px 0 0; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(var(--safe-bottom) + 40px); }
  .card {
    background: var(--surface-1); border-radius: 14px; border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(11,11,11,0.04); margin-bottom: 14px; overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .card-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-450); }
  .card-head h2 { font-size: 14.5px; font-weight: 700; margin: 0; }
  .card-body { padding: 0 14px 14px; }
  .lead { font-size: 12.5px; line-height: 1.6; color: var(--text-secondary); margin: 0 0 10px; }
  .list { display: grid; gap: 8px; }
  a.item {
    display: block; text-decoration: none; color: inherit;
    background: var(--accent-soft); border-radius: 10px; padding: 10px 30px 10px 12px;
    position: relative; transition: transform 0.08s ease;
  }
  a.item:active { transform: scale(0.98); }
  a.item::after {
    content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px;
    border-right: 2px solid var(--blue-450); border-bottom: 2px solid var(--blue-450);
    transform: translateY(-50%) rotate(-45deg);
  }
  .item .k { font-size: 10.5px; color: var(--blue-450); font-weight: 700; margin-bottom: 3px; }
  .item .v { font-size: 13.5px; font-weight: 700; line-height: 1.45; }
  .item .s { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; margin-top: 2px; }
  .empty { font-size: 12.5px; color: var(--text-muted); padding: 6px 0; }
  .foot { font-size: 11px; color: var(--text-muted); line-height: 1.6; margin-top: 12px; }
  .foot a { color: var(--blue-550); }
</style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">MIC資料室</h1>
    <p class="app-sub" id="updated">&nbsp;</p>
  </header>
  <main>
    <section class="card">
      <div class="card-head"><span class="dot"></span><h2>MIC豆知識</h2></div>
      <div class="card-body">
        <p class="lead">エアのしくみを、練習で見えている現象から説明する短い読み物です。1号5〜9ページ。スマホ縦向きで読めるようにしてあります。</p>
        <div class="list" id="list"><div class="empty">読み込み中…</div></div>
        <p class="foot">PDFが開かないときは、リンクを長押しして「ダウンロード」や「別のアプリで開く」を選んでください。</p>
      </div>
    </section>
  </main>
<script>
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  var list = document.getElementById("list");
  var updated = document.getElementById("updated");
  fetch("items.json?t=" + Math.floor(Date.now() / 600000), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      var items = (d.items || []).filter(function (x) { return x && x.published !== false; });
      if (!items.length) { list.innerHTML = '<div class="empty">まだ資料がありません。</div>'; return; }
      list.innerHTML = items.map(function (x) {
        return '<a class="item" href="' + esc(x.file) + '" target="_blank" rel="noopener">' +
          '<div class="k">' + esc(x.no) + (x.pages ? ' ・ ' + esc(x.pages) + 'ページ' : '') + '</div>' +
          '<div class="v">' + esc(x.title) + '</div>' +
          (x.subtitle ? '<div class="s">' + esc(x.subtitle) + '</div>' : '') +
          '</a>';
      }).join("");
      if (d.updated) updated.textContent = "更新：" + d.updated;
    })
    .catch(function () {
      list.innerHTML = '<div class="empty">一覧を読み込めませんでした。時間をおいて開き直してください。</div>';
    });
})();
</script>
</body>
</html>
